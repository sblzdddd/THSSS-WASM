name: Browser build

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  browser:
    name: Build without game assets
    runs-on: windows-latest
    env:
      # Private install so the runner uses the SDK pinned by global.json.
      # The browser host targets net10.0 and needs that SDK's wasm-tools workload.
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
      DOTNET_ROOT: ${{ github.workspace }}/.dotnet
      DOTNET_MULTILEVEL_LOOKUP: 0
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      - uses: actions/checkout@v4

      - name: Restore cached .NET SDK and wasm-tools
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: .dotnet
          key: ${{ runner.os }}-net10-wasm-tools-v1

      - name: Restore cached NuGet packages
        uses: actions/cache@v4
        with:
          path: .nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET 10
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Use the project-local .NET installation
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value $env:DOTNET_INSTALL_DIR

      - name: Install wasm-tools
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: dotnet workload install wasm-tools

      - name: Save .NET SDK and wasm-tools cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .dotnet
          key: ${{ runner.os }}-net10-wasm-tools-v1

      - name: Check SDK and workload
        shell: pwsh
        run: |
          $version = (dotnet --version).Trim()
          Write-Host "SDK $version"
          if ($version -notlike '10.*') {
            throw "Expected the .NET 10 SDK, found $version."
          }
          dotnet workload list

      - name: Confirm excluded assets are absent
        shell: pwsh
        run: |
          $names = @('BGM', 'BPic', 'CS', 'FX', 'Image', 'Model', 'Replay', 'ScreenShot', 'Sound', 'Story', 'Score.dat')
          $found = @($names | Where-Object { Test-Path -LiteralPath $_ })
          if ($found.Count -gt 0) {
            throw "Checkout contains excluded asset paths: $($found -join ', ')"
          }

      - name: Build browser host
        run: dotnet build THSSS.Browser/THSSS.Browser.csproj -c Release -p:StageGameAssets=false --nologo
